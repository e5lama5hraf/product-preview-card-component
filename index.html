<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Product preview card component | Frontend Mentor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="product-card">
    <picture>
      <source media="(min-width: 1024px)" srcset="images/image-product-desktop.jpg">
      <img class="product-image" src="images/image-product-mobile.jpg"
        alt="Gabrielle Essence perfume bottle surrounded by green leaves">
    </picture>
    <section class="product-content">
      <span class="product-category">Perfume</span>
      <h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>
      <p class="product-info">
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>
      <div class="price">
        <span class="product-new-price">$149.99</span>
        <span class="product-old-price">$169.99</span>
      </div>
      <button class="add-to-cart-btn"><img src="images/icon-cart.svg" alt="">Add to Cart</button>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/e5lama5hraf">Eslam Ashraf</a>.
  </footer>


</body>

</html>
